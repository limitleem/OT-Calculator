<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT Builder Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0f14;
            --surface: #161920;
            --surface2: #1e2028;
            --surface3: #252830;
            --border: rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.1);
            --text: #eef0f6;
            --text2: #9399a8;
            --text3: #5a6072;
            --accent: #f0c040;
            --accent2: #f8d878;
            --accent-dim: rgba(240,192,64,0.12);
            --green: #34d399;
            --green-dim: rgba(52,211,153,0.12);
            --blue: #60a5fa;
            --blue-dim: rgba(96,165,250,0.12);
            --red: #f87171;
            --red-dim: rgba(248,113,113,0.1);
            --radius: 14px;
            --radius-sm: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', 'Noto Sans Thai', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 60px;
            overflow-x: hidden;
        }

        /* HERO HEADER */
        .header-wrap {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 24px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-mark {
            width: 40px; height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .header-text p {
            font-size: 0.98rem;
            color: var(--text3);
            margin-top: 1px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grand-total-badge {
            background: var(--accent-dim);
            border: 1px solid rgba(240,192,64,0.25);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .grand-total-badge .label { font-size: 0.72rem; color: var(--accent2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .grand-total-badge .value { font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 500; color: var(--accent); }

        /* MAIN LAYOUT */
        .main { max-width: 1060px; margin: 0 auto; padding: 32px 24px; }

        /* SALARY CARD */
        .salary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
            align-items: center;
        }
        @media(max-width:640px){ .salary-card { grid-template-columns: 1fr; } }

        .salary-input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .salary-input-wrap {
            position: relative;
        }
        .salary-input-wrap .prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
        }
        .salary-input-wrap input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 1.3rem;
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            padding: 12px 14px 12px 32px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .salary-input-wrap input:focus {
            border-color: var(--accent);
            background: var(--surface3);
        }

        .rate-pills {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        @media(max-width:480px){ .rate-pills { grid-template-columns: repeat(2, 1fr); } }

        .rate-pill {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            transition: background 0.2s;
        }
        .rate-pill:hover { background: var(--surface3); }
        .rate-pill .rp-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }
        .rate-pill .rp-mult {
            font-size: 1.0rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .rp-mult.x1 { background: var(--blue-dim); color: var(--blue); }
        .rp-mult.x15 { background: var(--green-dim); color: var(--green); }
        .rp-mult.x3 { background: var(--accent-dim); color: var(--accent); }
        .rp-mult.daily { background: rgba(255,255,255,0.06); color: var(--text2); }

        .rate-pill .rp-val {
            font-family: 'DM Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        /* SECTION LABEL */
        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: var(--text3);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ITEMS */
        #items-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

        .item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .item:hover { border-color: var(--border2); }
        .item.active {
            border-color: rgba(240,192,64,0.3);
            box-shadow: 0 0 0 1px rgba(240,192,64,0.1);
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
        }

        .drag-handle {
            color: var(--text3);
            font-size: 0.9rem;
            cursor: grab;
            padding: 2px 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .drag-handle:hover { opacity: 1; }

        .item-type-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-weekday { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .dot-holiday { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

        .item-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-amount {
            font-family: 'DM Mono', monospace;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--accent);
        }

        .item-chevron {
            color: var(--text3);
            font-size: 0.7rem;
            transition: transform 0.25s;
        }
        .item.active .item-chevron { transform: rotate(180deg); }

        .item-body {
            display: none;
            padding: 0 18px 18px;
            border-top: 1px solid var(--border);
            margin-top: 0;
            padding-top: 18px;
            animation: slideDown 0.2s ease;
        }
        .item.active .item-body { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FORM FIELDS */
        .field-row {
            display: grid;
            gap: 12px;
            margin-bottom: 12px;
        }
        .col-3 { grid-template-columns: 1fr 1fr 1fr; }
        .col-2 { grid-template-columns: 1fr 2fr; }
        @media(max-width:580px){
            .col-3, .col-2 { grid-template-columns: 1fr; }
        }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 6px;
        }

.btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
}

/* ADD button = auto size (DON'T stretch) */
.btn-row .btn-add:first-child {
    flex: 1;
    white-space: nowrap; /* 👈 prevent vertical text */
}

/* CLEAR button = take remaining space */
.btn-clear {
    flex: 0; /* 👈 this one grows instead */
}

.btn-add {
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap; /* 👈 important */
}


.btn-clear {
    border-color: rgba(248,113,113,0.4);
    color: var(--red);
}

.btn-clear:hover {
    background: var(--red-dim);
    border-color: rgba(248,113,113,0.6);
}



        .field input, .field select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'DM Sans', 'Noto Sans Thai', sans-serif;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            -webkit-appearance: none;
        }
        .field input:focus, .field select:focus {
            border-color: var(--accent);
            background: var(--surface3);
        }
        .field select option { background: var(--surface2); }

        /* Flatpickr override */
        .flatpickr-calendar {
            background: var(--surface2) !important;
            border: 1px solid var(--border2) !important;
            border-radius: var(--radius) !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5) !important;
            font-family: 'DM Sans', sans-serif !important;
            color: var(--text) !important;
        }
        .flatpickr-time input, .flatpickr-time .flatpickr-am-pm {
            background: transparent !important;
            color: var(--text) !important;
        }
        .flatpickr-time .numInputWrapper:hover { background: var(--surface3) !important; }
        .flatpickr-time .arrowUp::after { border-bottom-color: var(--text2) !important; }
        .flatpickr-time .arrowDown::after { border-top-color: var(--text2) !important; }
        .flatpickr-time input.cur-value { color: var(--accent) !important; font-weight: 600; }

        /* CHECKBOX CUSTOM */
        .checkbox-custom {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface2); transition: all 0.2s; user-select: none;
        }
        .checkbox-custom:hover { background: var(--surface3); border-color: var(--border2); }
        .checkbox-custom.checked { background: var(--accent-dim); border-color: var(--accent); }
        .checkbox-custom input { display: none; }
        .cb-box {
            width: 18px; height: 18px; border: 2px solid var(--text3); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .checkbox-custom.checked .cb-box { background: var(--accent); border-color: var(--accent); }
        .checkbox-custom.checked .cb-box::after {
            content: '✓'; color: #000; font-size: 12px; font-weight: 900;
        }
        .error-text { color: var(--red); font-size: 0.75rem; margin-top: 4px; display: none; font-weight: 500; }

        .clickable-days {
            cursor: pointer; color: var(--blue); border-bottom: 1px dashed var(--blue);
            transition: opacity 0.2s; display: inline-block;
        }
        .clickable-days:hover { opacity: 0.7; }

        /* INFO STRIP */
        .info-strip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .info-strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; margin-top: 6px; }
        .info-strip .info-text {
            font-size: 0.78rem;
            color: var(--text2);
            font-weight: 500;
            line-height: 1.6;
            flex: 1;
        }

        /* DELETE BTN */
        .btn-del {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: var(--radius-sm);
            color: var(--red);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 7px 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .btn-del:hover { background: var(--red-dim); border-color: rgba(248,113,113,0.4); }

        /* ADD BUTTON */
        .btn-add {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: transparent;
            border: 1.5px dashed rgba(240,192,64,0.3);
            border-radius: var(--radius);
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'DM Sans', 'Noto Sans Thai', sans-serif;
            padding: 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 28px;
        }
        .btn-add:hover { background: var(--accent-dim); border-color: rgba(240,192,64,0.5); }
        .btn-add svg { transition: transform 0.2s; }
        .btn-add:hover svg { transform: rotate(90deg); }

        /* RESULTS CARD */
        .results-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .results-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .results-header span {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text3);
        }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 0.85rem; }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.88rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text3);
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(255,255,255,0.02); }

        tfoot tr td {
            padding: 14px 16px;
            background: var(--surface2);
            border-top: 1px solid var(--border2);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .badge-wd { background: var(--green-dim); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }
        .badge-hd { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(240,192,64,0.2); }

        .hours-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            padding: 3px 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
            color: var(--text2);
            margin-right: 4px;
            white-space: nowrap;
        }
        .hours-chip.x1 { color: var(--blue); background: var(--blue-dim); }
        .hours-chip.x15 { color: var(--green); background: var(--green-dim); }
        .hours-chip.x3 { color: var(--accent); background: var(--accent-dim); }

        .mono { font-family: 'DM Mono', monospace; font-size: 0.82rem; }
        .amount { font-family: 'DM Mono', monospace; font-weight: 500; }
        .amount.positive { color: var(--accent); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text3);
            font-size: 0.85rem;
        }
        .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

        /* Grand total styling */
        .grand-total-text {
            color: var(--text3);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .grand-total-num {
            font-family: 'DM Mono', monospace;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--accent);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        /* Sortable ghost */
        .sortable-ghost { opacity: 0.3; }
        .sortable-drag { opacity: 0.9; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 90%; max-width: 500px;
            max-height: 80vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: translateY(20px); transition: transform 0.2s;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-header h3 { font-size: 1.1rem; color: var(--text); }
        .modal-close {
            background: transparent; border: none; color: var(--text3);
            font-size: 1.5rem; cursor: pointer; transition: color 0.2s;
        }
        .modal-close:hover { color: var(--text); }
        .modal-body {
            padding: 20px 24px; overflow-y: auto; flex: 1;
        }
        .holiday-list { display: flex; flex-direction: column; gap: 12px; }
        .holiday-item {
            background: var(--surface2); border: 1px solid var(--border2);
            border-radius: var(--radius-sm); padding: 12px 16px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .holiday-date { color: var(--accent); font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; }
        .holiday-title { color: var(--text); font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

<div class="header-wrap">
    <div class="logo-mark">⏱</div>
    <div class="header-text">
        <h1>OT Builder Pro</h1>
        <p>คำนวณค่าล่วงเวลาอย่างแม่นยำ</p>
    </div>
    <div class="header-right">
        <div class="grand-total-badge">
            <div>
                <div class="label">โอทีรวม</div>
                <div class="value" id="headerTotal">฿0.00</div>
            </div>
        </div>
    </div>
</div>

<div class="main">

    <!-- SALARY CARD -->
    <div class="salary-card">
        <div class="salary-input-group">
            <label>ฐานเงินเดือน</label>
            <div class="salary-input-wrap">
                <span class="prefix">฿</span>
                <input id="salary" type="number" value="20380" placeholder="0">
            </div>
        </div>
        <div class="rate-pills">
            <div class="rate-pill">
                <div class="rp-label">ค่าแรงรายวัน (7 ชม.)</div>
                <div class="rp-mult daily">×1 day</div>
                <div class="rp-val" id="sumDaily">—</div>
            </div>
            <div class="rate-pill">
                <div class="rp-label">ค่าแรง 1 เท่า / ชม.</div>
                <div class="rp-mult x1">×1.0</div>
                <div class="rp-val" id="sum1">—</div>
            </div>
            <div class="rate-pill">
                <div class="rp-label">ค่าแรง 1.5 เท่า / ชม.</div>
                <div class="rp-mult x15">×1.5</div>
                <div class="rp-val" id="sum15">—</div>
            </div>
            <div class="rate-pill">
                <div class="rp-label">ค่าแรง 3 เท่า / ชม.</div>
                <div class="rp-mult x3">×3.0</div>
                <div class="rp-val" id="sum3">—</div>
            </div>
        </div>
    </div>

    <!-- ITEMS SECTION -->

                <span id="itemCount" style="color:var(--text2)">0 รายการ</span>

</div>

<script>
    const HOLIDAY_2569 = [
        {"date":"2026-01-01","title":"วันขึ้นปีใหม่"},
        {"date":"2026-01-02","title":"วันหยุดราชการเพิ่มเติมเป็นกรณีพิเศษ"},
        {"date":"2026-03-03","title":"วันมาฆบูชา"},
        {"date":"2026-04-06","title":"วันพระบาทสมเด็จพระพุทธยอดฟ้าจุฬาโลกมหาราช และวันที่ระลึกมหาจักรีบรมราชวงศ์"},
        {"date":"2026-04-13","title":"วันสงกรานต์"},
        {"date":"2026-04-14","title":"วันสงกรานต์"},
        {"date":"2026-04-15","title":"วันสงกรานต์"},
        {"date":"2026-05-01","title":"วันแรงงานแห่งชาติ"},
        {"date":"2026-05-04","title":"วันฉัตรมงคล"},
        {"date":"2026-05-13","title":"วันพระราชพิธีจรดพระนังคัลแรกนาขวัญ"},
        {"date":"2026-06-01","title":"ชดเชยวันวิสาขบูชา"},
        {"date":"2026-06-03","title":"วันเฉลิมพระชนพรรษาสมเด็จพระนางเจ้าฯ พระบรมราชินี"},
        {"date":"2026-07-28","title":"วันเฉลิมพระชนพรรษาพระบาทสมเด็จพระปรเมนทรรามาธิบดีศรีสินทรมหาวชิราลงกรณ พระวชิรเกล้าเจ้าอยู่หัว"},
        {"date":"2026-07-29","title":"วันอาสาฬหบูชา"},
        {"date":"2026-07-30","title":"วันเข้าพรรษา"},
        {"date":"2026-08-12","title":"วันเฉลิมพระชนพรรษาสมเด็จพระบรมราชชนนีพันปีหลวงและวันแม่แห่งชาติ"},
        {"date":"2026-10-13","title":"วันคล้ายวันสวรรคตของพระบาทสมเด็จพระบรมชนกาธิเบศรมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร"},
        {"date":"2026-10-23","title":"วันปิยมหาราช"},
        {"date":"2026-12-07","title":"ชดเชยวันพ่อแห่งชาติ"},
        {"date":"2026-12-10","title":"วันรัฐธรรมนูญ"},
        {"date":"2026-12-31","title":"วันสิ้นปี"}
    ];

    const isHoliday = (dateStr) => {
        const d = new Date(dateStr);
        const day = d.getDay();
        if (day === 0 || day === 6) return true; // Sunday or Saturday
        return HOLIDAY_2569.some(h => h.date === dateStr);
    };

    const getHolidayTitle = (dateStr) => {
        const h = HOLIDAY_2569.find(h => h.date === dateStr);
        if (h) return h.title;
        const d = new Date(dateStr);
        const day = d.getDay();
        if (day === 0) return "วันอาทิตย์";
        if (day === 6) return "วันเสาร์";
        return "";
    };

    const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const THAI_DAYS = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];

    const formatThaiDate = (dateStr) => {
        if (!dateStr) return { short: "", full: "" };
        const d = new Date(dateStr);
        const day = THAI_DAYS[d.getDay()];
        const date = d.getDate();
        const month = THAI_MONTHS[d.getMonth()];
        const year = d.getFullYear() + 543;
        return { short: `${date} ${month} ${year}`, full: `${day} ${date} ${month} ${year}`, monthIndex: d.getMonth(), monthName: month, year };
    };

    const showDaysBreakdown = (title, dateList) => {
        const modal = document.getElementById("dayBreakdownModal");
        const listContainer = document.getElementById("dayBreakdownList");
        document.getElementById("dayBreakdownTitle").innerText = title;
        
        // Grouping logic for "1 - 5 , 9 - 10"
        let groups = [];
        if (dateList.length > 0) {
            let temp = [dateList[0]];
            for (let i = 1; i < dateList.length; i++) {
                let prev = new Date(dateList[i-1]);
                let curr = new Date(dateList[i]);
                prev.setDate(prev.getDate() + 1);
                if (prev.toISOString().split('T')[0] === dateList[i]) {
                    temp.push(dateList[i]);
                } else {
                    groups.push(temp);
                    temp = [dateList[i]];
                }
            }
            groups.push(temp);
        }

        let summaryText = dateList.length + " วัน (";
        summaryText += groups.map(g => {
            if (g.length === 1) return new Date(g[0]).getDate();
            return new Date(g[0]).getDate() + "-" + new Date(g[g.length-1]).getDate();
        }).join(", ");
        summaryText += ")";

        listContainer.innerHTML = `<div style="font-weight:700; color:var(--accent); margin-bottom:12px;">${summaryText}</div>`;
        
        listContainer.innerHTML += dateList.map(d => {
            const fd = formatThaiDate(d);
            const holidayTitle = getHolidayTitle(d);
            return `
                <div class="holiday-item">
                    <div class="holiday-date">${fd.full}</div>
                    <div class="holiday-title">${holidayTitle}</div>
                </div>
            `;
        }).join('');
        
        modal.classList.add("show");
    };

    window.addEventListener('DOMContentLoaded', () => renderHolidays());

    const renderHolidays = () => {
        const list = document.getElementById("holidayListContainer");
        const select = document.getElementById("holidayYearSelect");
        if(!list) return;

        const years = [...new Set(HOLIDAY_2569.map(h => new Date(h.date).getFullYear()))].sort();
        if(select && select.options.length === 0) {
            years.forEach(y => {
                const opt = document.createElement("option");
                opt.value = y;
                opt.text = y + 543;
                select.appendChild(opt);
            });
            if(years.length > 0) select.value = years[0];
        }

        const filterYear = select ? parseInt(select.value) : (years[0] || new Date().getFullYear());
        const filtered = HOLIDAY_2569.filter(h => new Date(h.date).getFullYear() === filterYear);
        
        let html = '';
        let currentMonth = -1;

        filtered.forEach(h => {
            const fd = formatThaiDate(h.date);
            if (fd.monthIndex !== currentMonth) {
                html += `<div style="color:var(--text3); font-size:0.8rem; font-weight:700; margin-top:12px; margin-bottom:4px; border-bottom:1px solid var(--border); padding-bottom:4px;">${fd.monthName} ${fd.year}</div>`;
                currentMonth = fd.monthIndex;
            }
            html += `
                <div class="holiday-item">
                    <div class="holiday-date">${fd.full}</div>
                    <div class="holiday-title">${h.title}</div>
                </div>
            `;
        });
        list.innerHTML = html || '<div class="empty-state" style="padding:20px;">ไม่มีวันหยุดในปีที่เลือก</div>';
    };

    const getDaysInRange = (rangeStr) => {
        if (!rangeStr) return [];
        const parts = rangeStr.split(" to ");
        const dates = [];
        let curr = new Date(parts[0]);
        const end = new Date(parts.length > 1 ? parts[1] : parts[0]);
        while (curr <= end) {
            dates.push(curr.toISOString().split('T')[0]);
            curr.setDate(curr.getDate() + 1);
        }
        return dates;
    };

    const toHour = t => {
        if (!t) return 0;
        const [h, m] = t.split(":").map(Number);
        return h + m / 60;
    };
    const fm = n => n != null ? n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "0.00";
    const fh = n => n != null ? (n % 1 === 0 ? n : +n.toFixed(2)) : "0";

    function addItem() {
        document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
        const id = Date.now();
        const html = `
        <div class="item active" data-id="${id}">
            <div class="item-header" onclick="this.closest('.item').classList.toggle('active')">
                <span class="drag-handle" title="ลาก">⠿</span>
                <span class="item-type-dot dot-weekday"></span>
                <span class="item-name">รายการใหม่</span>
                <div class="item-meta">
                    <span class="item-amount">฿0.00</span>
                    <svg class="item-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none">
                        <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div class="item-body" onclick="event.stopPropagation();">
                <div class="field-row col-2">
                    <div class="field">
                        <label>ช่วงวันที่ทำ OT</label>
                        <input class="date-range" placeholder="เลือกช่วงวันที่">
                    </div>
                    <div class="field">
                        <label>ประเภทวัน</label>
                        <div style="display:flex; gap:12px; align-items:center; height:38px;">
                            <label class="checkbox-custom checked">
                                <input type="checkbox" class="chk-wd" checked>
                                <div class="cb-box"></div>
                                <span>วันทำงาน</span>
                            </label>
                            <label class="checkbox-custom">
                                <input type="checkbox" class="chk-hd">
                                <div class="cb-box"></div>
                                <span>วันหยุด</span>
                            </label>
                        </div>
                        <div class="error-text"></div>
                    </div>
                </div>
                <div class="field-row col-2 time-row-wd">
                    <div class="field">
                        <label>เวลาเริ่ม (วันทำงาน)</label>
                        <input class="start-wd" placeholder="เลือกเวลา">
                    </div>
                    <div class="field">
                        <label>เวลาสิ้นสุด (วันทำงาน)</label>
                        <input class="end-wd" placeholder="เลือกเวลา">
                    </div>
                </div>
                <div class="field-row col-2 time-row-hd" style="display:none;">
                    <div class="field">
                        <label>เวลาเริ่ม (วันหยุด)</label>
                        <input class="start-hd" placeholder="เลือกเวลา">
                    </div>
                    <div class="field">
                        <label>เวลาสิ้นสุด (วันหยุด)</label>
                        <input class="end-hd" placeholder="เลือกเวลา">
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>ชื่อรายการ / หมายเหตุ</label>
                        <input class="name" placeholder="เช่น โอทีปิดงบ, เข้าเวรวันอาทิตย์…">
                    </div>
                </div>
                <div class="info-strip">
                    <span class="dot"></span>
                    <span class="info-text">กำลังรอข้อมูล...</span>
                </div>
                <button class="btn-del" onclick="this.closest('.item').remove(); calculate()">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    ลบรายการ
                </button>
            </div>
        </div>`;

        document.getElementById("items-container").insertAdjacentHTML("beforeend", html);
        const el = document.querySelector(`[data-id="${id}"]`);

        const dateRange = el.querySelector(".date-range");
        const chkWd = el.querySelector(".chk-wd");
        const chkHd = el.querySelector(".chk-hd");
        const timeRowWd = el.querySelector(".time-row-wd");
        const timeRowHd = el.querySelector(".time-row-hd");
        const startWd = el.querySelector(".start-wd");
        const endWd = el.querySelector(".end-wd");
        const startHd = el.querySelector(".start-hd");
        const endHd = el.querySelector(".end-hd");
        const name = el.querySelector(".name");
        const info = el.querySelector(".info-text");

        const fpRange = flatpickr(dateRange, { mode: "range", dateFormat: "Y-m-d" });
        const fpWdStart = flatpickr(startWd, { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, defaultDate: "17:00" });
        const fpWdEnd = flatpickr(endWd, { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, defaultDate: "21:00" });
        const fpHdStart = flatpickr(startHd, { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, defaultDate: "08:30" });
        const fpHdEnd = flatpickr(endHd, { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, defaultDate: "17:00" });

        // Set default date range to today
        const today = new Date().toISOString().split('T')[0];
        fpRange.setDate(today);

        const updateUI = () => {
            const dates = getDaysInRange(dateRange.value);
            let hdCount = 0;
            let wdCount = 0;
            dates.forEach(d => {
                if (isHoliday(d)) hdCount++;
                else wdCount++;
            });

            // Validation
            const errorEl = el.querySelector(".error-text");
            errorEl.style.display = "none";
            errorEl.innerText = "";

            if (chkWd.checked && dates.length > 0 && wdCount === 0) {
                errorEl.innerText = "ไม่มีวันทำงานในช่วงวันที่เลือก!";
                errorEl.style.display = "block";
            }
            if (chkHd.checked && dates.length > 0 && hdCount === 0) {
                errorEl.innerText = "ไม่มีวันหยุดในช่วงวันที่เลือก!";
                errorEl.style.display = "block";
            }

            // Sync visual state of custom checkboxes
            el.querySelectorAll(".checkbox-custom").forEach(cb => {
                cb.classList.toggle("checked", cb.querySelector("input").checked);
            });

            timeRowWd.style.display = chkWd.checked ? "grid" : "none";
            timeRowHd.style.display = chkHd.checked ? "grid" : "none";

            let valid = false;
            if (dates.length === 0) {
                info.innerHTML = 'กรุณาเลือกช่วงวันที่';
            } else if (!chkWd.checked && !chkHd.checked) {
                info.innerHTML = 'กรุณาเลือกประเภทวัน';
            } else {
                let parts = [];
                
                const calcHours = (s_val, e_val, isWd) => {
                    if (!s_val || !e_val) return null;
                    let s = toHour(s_val);
                    let e = toHour(e_val);
                    if (e <= s) e += 24;
                    let total = 0, breakTime = 0, h1 = 0, h15 = 0, h3 = 0;
                    for (let h = s; h < e; h += 0.5) {
                        let x = h >= 24 ? h - 24 : h;
                        if (isWd) {
                            if (x >= 8.5 && x < 16.5) continue;
                            h15 += 0.5; total += 0.5;
                        } else {
                            if (x >= 8.5 && x < 16.5) {
                                if (x >= 12 && x < 13) { breakTime += 0.5; continue; }
                                h1 += 0.5;
                            } else {
                                h3 += 0.5;
                            }
                            total += 0.5;
                        }
                    }
                    return { total, h1, h15, h3, breakTime, s, e };
                };

                if (chkWd.checked && wdCount > 0) {
                    const res = calcHours(startWd.value, endWd.value, true);
                    if (res) {
                        let subParts = [];
                        if (res.h15 > 0) subParts.push(`<span style="color:var(--text3)">${fh(res.h15)} ชม. × 1.5 เท่า (เรตวันทำงาน)</span>`);
                        
                        let txt = `<div style="margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                            <span class="badge badge-wd" style="font-size:0.65rem; padding:2px 6px;">วันทำงาน ${wdCount} วัน</span>
                            <span style="font-weight:700; color:var(--text);">${fh(res.total)} ชม.</span>
                            <span style="color:var(--border2)">·</span>
                            ${subParts.join(' · ')}
                        </div>`;
                        parts.push(txt);
                    }
                }
                if (chkHd.checked && hdCount > 0) {
                    const res = calcHours(startHd.value, endHd.value, false);
                    if (res) {
                        let subParts = [];
                        if (res.h1 > 0) subParts.push(`<span style="color:var(--text3)">${fh(res.h1)} ชม. × 1 เท่า (เรตช่วง 8.30 - 16.30)</span>`);
                        if (res.h3 > 0) subParts.push(`<span style="color:var(--text3)">${fh(res.h3)} ชม. × 3 เท่า (เรตช่วง 16.30 - 8.30)</span>`);
                        if (res.breakTime > 0) subParts.push(`<span style="color:var(--red)">หักพัก ${fh(res.breakTime)} ชม. (12.00 - 13.00)</span>`);
                        
                        let txt = `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                            <span class="badge badge-hd" style="font-size:0.65rem; padding:2px 6px;">วันหยุด ${hdCount} วัน</span>
                            <span style="font-weight:700; color:var(--text);">${fh(res.total)} ชม.</span>
                            <span style="color:var(--border2)">·</span>
                            ${subParts.join(' · ')}
                        </div>`;
                        parts.push(txt);
                    }
                }

                info.innerHTML = parts.length > 0 ? parts.join('') : 'กรุณาเลือกเวลา';
                valid = true;
            }

            const dot = el.querySelector(".item-type-dot");
            if (chkWd.checked && chkHd.checked) dot.className = "item-type-dot dot-weekday"; 
            else if (chkHd.checked) dot.className = "item-type-dot dot-holiday";
            else dot.className = "item-type-dot dot-weekday";

            if (!name.dataset.edited && dates.length > 0) {
                const d1 = formatThaiDate(dates[0]).short;
                const d2 = formatThaiDate(dates[dates.length-1]).short;
                name.value = dates.length > 1 ? `OT ${d1} - ${d2}` : `OT ${d1}`;
                el.querySelector(".item-name").innerText = name.value;
            }
            
            calculate();
        };

        name.oninput = () => {
            name.dataset.edited = "1";
            el.querySelector(".item-name").innerText = name.value || "รายการใหม่";
            calculate();
        };

        [dateRange, chkWd, chkHd, startWd, endWd, startHd, endHd].forEach(inp => {
            if(inp.type === "checkbox") inp.addEventListener("change", updateUI);
            else inp.addEventListener("change", updateUI);
        });

        updateUI();
    }

    function calMoney(money){
        return Math.round(money * 100) / 100;
    }

    function calculate() {
        const salary = +document.getElementById("salary").value || 0;
        const hourly = calMoney(salary / 30 / 7);   
        const daily = calMoney(hourly * 7);

        document.getElementById("sumDaily").innerText = fm(daily);
        document.getElementById("sum1").innerText = fm(hourly);
        document.getElementById("sum15").innerText = fm(hourly * 1.5);
        document.getElementById("sum3").innerText = fm(hourly * 3);

        const resultTable = document.getElementById("result-table");
        let grandTotal = 0;
        let rows = "";

        const items = document.querySelectorAll(".item");
        items.forEach(item => {
            const dateRangeValue = item.querySelector(".date-range").value;
            const dates = getDaysInRange(dateRangeValue);
            const name = item.querySelector(".name").value || "รายการไม่มีชื่อ";
            const chkWd = item.querySelector(".chk-wd").checked;
            const chkHd = item.querySelector(".chk-hd").checked;

            let wdDates = [], hdDates = [];
            dates.forEach(d => {
                if (isHoliday(d)) hdDates.push(d);
                else wdDates.push(d);
            });

            const prHrly1 = hourly;
            const prHrly15 = calMoney(hourly * 1.5);
            const prHrly3 = calMoney(hourly * 3);

            const calcRow = (isWd, startVal, endVal, count, dateList) => {
                if (!startVal || !endVal || count === 0) return null;
                let s = toHour(startVal);
                let e = toHour(endVal);
                if (e <= s && s > 0) e += 24;
                let h1 = 0, h15 = 0, h3 = 0;
                for (let h = s; h < e; h += 0.5) {
                    let x = h >= 24 ? h - 24 : h;
                    if (isWd) {
                        if (x >= 8.5 && x < 16.5) continue;
                        h15 += 0.5;
                    } else {
                        if (x >= 8.5 && x < 16.5) {
                            if (x >= 12 && x < 13) continue;
                            h1 += 0.5;
                        } else { h3 += 0.5; }
                    }
                }

                let hhh1 = calMoney(h1 * hourly);
                if(h1 >= 7){
                    hhh1 = calMoney(3.5 * hourly) + calMoney((h1-3.5) * hourly) ;
                }
                const hhh15 = calMoney(h15 * prHrly15);
                const hhh3 = calMoney(h3 * prHrly3);

                const dayValRaw = calMoney(hhh1 + hhh15 + hhh3); 
                const dayVal = calMoney(dayValRaw);
                const total = calMoney(dayVal * count);

                const c1 = h1 > 0 ? `<span class="hours-chip x1">${fh(h1)}h × 1.0 = ${fm(hhh1)}</span>` : '';
                const c15 = h15 > 0 ? `<span class="hours-chip x15">${fh(h15)}h × 1.5 = ${fm(hhh15)}</span>` : '';
                const c3 = h3 > 0 ? `<span class="hours-chip x3">${fh(h3)}h × 3.0 = ${fm(hhh3)}</span>` : '';
                const ratesHtml = `${c1}${c15}${c3}`;

                const badgeHtml = isWd ? '<span class="badge badge-wd" style="margin-right:6px;">WD</span>' : '<span class="badge badge-hd" style="margin-right:6px;">HD</span>';
                const timeHtml = `<div class="text-center mono" style="display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:0.75rem">${badgeHtml}${startVal}–${endVal} ${(e > 24) ? '<span style="font-size:0.6rem;color:var(--blue);background:var(--blue-dim);padding:1px 4px;border-radius:3px;margin-left:4px;">+1</span>' : ''}</div>`;
                
                const nameSafe = name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const datesJson = JSON.stringify(dateList).replace(/"/g, '&quot;');
                const daysDisplay = `<span class="clickable-days" onclick="showDaysBreakdown('${isWd?'วันทำงาน':'วันหยุด'} - ${nameSafe}', ${datesJson})">${count} วัน</span>`;

                return { total, ratesHtml, timeHtml, dayVal, daysDisplay };
            };

            let itemTotal = 0;
            let wdData = null;
            let hdData = null;

            if (chkWd && wdDates.length > 0) wdData = calcRow(true, item.querySelector(".start-wd").value, item.querySelector(".end-wd").value, wdDates.length, wdDates);
            if (chkHd && hdDates.length > 0) hdData = calcRow(false, item.querySelector(".start-hd").value, item.querySelector(".end-hd").value, hdDates.length, hdDates);

            if (wdData && hdData) {
                itemTotal = wdData.total + hdData.total;
                rows += `
                <tr>
                    <td rowspan="2">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span style="font-weight:600;font-size:0.85rem">${name}</span>
                        </div>
                    </td>
                    <td>${wdData.timeHtml}</td>
                    <td style="white-space:nowrap">${wdData.ratesHtml}</td>
                    <td class="text-center mono" style="color:var(--text2)">${wdData.daysDisplay}</td>
                    <td class="text-right"><span class="amount positive">฿${fm(wdData.total)}</span></td>
                    <td rowspan="2" class="text-right" style="border-left:1px solid var(--border); background:rgba(240,192,64,0.03)"><span class="amount positive" style="font-weight:700">฿${fm(itemTotal)}</span></td>
                </tr>
                <tr>
                    <td>${hdData.timeHtml}</td>
                    <td style="white-space:nowrap">${hdData.ratesHtml}</td>
                    <td class="text-center mono" style="color:var(--text2)">${hdData.daysDisplay}</td>
                    <td class="text-right"><span class="amount positive">฿${fm(hdData.total)}</span></td>
                </tr>`;
            } else if (wdData) {
                itemTotal = wdData.total;
                rows += `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span style="font-weight:600;font-size:0.85rem">${name}</span>
                        </div>
                    </td>
                    <td>${wdData.timeHtml}</td>
                    <td style="white-space:nowrap">${wdData.ratesHtml}</td>
                    <td class="text-center mono" style="color:var(--text2)">${wdData.daysDisplay}</td>
                    <td class="text-right"><span class="amount positive">฿${fm(wdData.total)}</span></td>
                    <td class="text-right" style="border-left:1px solid var(--border); background:rgba(240,192,64,0.03)"><span class="amount positive" style="font-weight:700">฿${fm(itemTotal)}</span></td>
                </tr>`;
            } else if (hdData) {
                itemTotal = hdData.total;
                rows += `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span style="font-weight:600;font-size:0.85rem">${name}</span>
                        </div>
                    </td>
                    <td>${hdData.timeHtml}</td>
                    <td style="white-space:nowrap">${hdData.ratesHtml}</td>
                    <td class="text-center mono" style="color:var(--text2)">${hdData.daysDisplay}</td>
                    <td class="text-right"><span class="amount positive">฿${fm(hdData.total)}</span></td>
                    <td class="text-right" style="border-left:1px solid var(--border); background:rgba(240,192,64,0.03)"><span class="amount positive" style="font-weight:700">฿${fm(itemTotal)}</span></td>
                </tr>`;
            } else {
                rows += `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                            <span style="font-weight:600;font-size:0.85rem">${name}</span>
                        </div>
                    </td>
                    <td>—</td>
                    <td></td>
                    <td class="text-center mono" style="color:var(--text2)">0 วัน</td>
                    <td class="text-right"><span class="amount positive">฿0.00</span></td>
                    <td class="text-right" style="border-left:1px solid var(--border); background:rgba(240,192,64,0.03)"><span class="amount positive" style="font-weight:700">฿0.00</span></td>
                </tr>`;
            }

            grandTotal += itemTotal;
            grandTotal = calMoney(grandTotal);

            // Update header amount in item
            item.querySelector(".item-amount").innerText = `฿${fm(itemTotal)}`;
        });

        document.getElementById("itemCount").innerText = `${items.length} รายการ`;

        const emptyRow = `<tr><td colspan="6"><div class="empty-state"><div class="icon">📋</div>ยังไม่มีรายการ กด "เพิ่มรายการโอที"</div></td></tr>`;

        document.getElementById("result-table").innerHTML = `
        <table>
            <thead>
                <tr>
                    <th style="width:25%">รายการ</th>
                    <th class="text-center">ช่วงเวลา</th>
                    <th>ชั่วโมง & อัตรา</th>
                    <th class="text-center">วัน</th>
                    <th class="text-right">รวม (บาท)</th>
                    <th class="text-right">รวมทั้งสิ้น</th>
                </tr>
            </thead>
            <tbody>${rows || emptyRow}</tbody>
            <tfoot>
                <tr>
                    <td colspan="5" class="text-right">
                        <span class="grand-total-text">รวมเงินโอทีทั้งหมด</span>
                    </td>
                    <td class="text-right">
                        <span class="grand-total-num">฿${fm(grandTotal)}</span>
                    </td>
                </tr>
            </tfoot>
        </table>`;

        document.getElementById("headerTotal").innerText = `฿${fm(grandTotal)}`;

        // SAVE
        const data = {
            version: "2.0",
            salary: document.getElementById("salary").value,
            items: []
        };

        document.querySelectorAll(".item").forEach(item => {
            data.items.push({
                dateRange: item.querySelector(".date-range").value,
                chkWd: item.querySelector(".chk-wd").checked,
                chkHd: item.querySelector(".chk-hd").checked,
                startWd: item.querySelector(".start-wd").value,
                endWd: item.querySelector(".end-wd").value,
                startHd: item.querySelector(".start-hd").value,
                endHd: item.querySelector(".end-hd").value,
                name: item.querySelector(".name").value,
                datasetEdited: item.querySelector(".name").dataset.edited
            });
        });

        localStorage.setItem("otData", JSON.stringify(data));
    }

    function loadData() {
        try {
            const stored = localStorage.getItem("otData");
            if (!stored) return;
            const data = JSON.parse(stored);

            if (data.salary) {
                document.getElementById("salary").value = data.salary;
            }

            if (data.items && data.items.length) {
                document.getElementById("items-container").innerHTML = "";
                data.items.forEach(it => {
                    addItem();
                    const el = document.querySelector("#items-container .item:last-child");

                    if (it.dateRange !== undefined) {
                        // New format
                        if (it.dateRange) {
                             el.querySelector(".date-range")._flatpickr.setDate(it.dateRange.includes(" to ") ? it.dateRange.split(" to ") : it.dateRange);
                        }
                        el.querySelector(".chk-wd").checked = it.chkWd;
                        el.querySelector(".chk-hd").checked = it.chkHd;
                        if(it.startWd) el.querySelector(".start-wd")._flatpickr.setDate(it.startWd);
                        if(it.endWd) el.querySelector(".end-wd")._flatpickr.setDate(it.endWd);
                        if(it.startHd) el.querySelector(".start-hd")._flatpickr.setDate(it.startHd);
                        if(it.endHd) el.querySelector(".end-hd")._flatpickr.setDate(it.endHd);
                        el.querySelector(".name").value = it.name || "";
                        if(it.datasetEdited) el.querySelector(".name").dataset.edited = it.datasetEdited;
                    } else {
                        // Legacy format
                        el.querySelector(".name").value = it.name || "";
                        if (it.type === "weekday") {
                            el.querySelector(".chk-wd").checked = true;
                            el.querySelector(".chk-hd").checked = false;
                            el.querySelector(".start-wd")._flatpickr.setDate(it.start || "17:00");
                            el.querySelector(".end-wd")._flatpickr.setDate(it.end || "21:00");
                        } else {
                            el.querySelector(".chk-wd").checked = false;
                            el.querySelector(".chk-hd").checked = true;
                            el.querySelector(".start-hd")._flatpickr.setDate(it.start || "08:30");
                            el.querySelector(".end-hd")._flatpickr.setDate(it.end || "17:00");
                        }
                    }

                    // trigger update
                    el.querySelector(".chk-wd").dispatchEvent(new Event("change"));
                });
            }
        } catch (e) {
            console.error("Data Load Error:", e);
            alert("พบข้อผิดพลาดในการโหลดข้อมูล (โครงสร้างข้อมูลไม่รองรับ) ระบบจะรีเซ็ตข้อมูลเพื่อเริ่มใหม่");
            localStorage.removeItem("otData");
            location.reload();
        }
    }

    function clearAll() {
        if (!confirm("ลบรายการโอทีทั้งหมดใช่ไหม?")) return;
        document.getElementById("items-container").innerHTML = "";
        localStorage.removeItem("otData");
        calculate();
    }

    new Sortable(document.getElementById("items-container"), {
        animation: 200,
        handle: ".drag-handle",
        ghostClass: "sortable-ghost",
        dragClass: "sortable-drag",
        onEnd: calculate
    });

    document.getElementById("salary").oninput = calculate;
    loadData();
    calculate();

    // fallback if empty
    if (!document.querySelectorAll(".item").length) {
        addItem();
    }
</script>
</body>
</html>
